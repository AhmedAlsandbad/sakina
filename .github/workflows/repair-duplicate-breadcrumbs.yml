name: One-time duplicate breadcrumb repair

on:
  push:
    paths:
      - '.github/workflows/repair-duplicate-breadcrumbs.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Remove redundant BreadcrumbList schemas
        run: python scripts/repair_duplicate_breadcrumbs.py
      - name: Commit repaired pages
        run: |
          if git diff --quiet; then
            echo "No repairs needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add '*.html' ':!google*.html'
          git commit -m "Remove duplicate BreadcrumbList schemas"
          git push

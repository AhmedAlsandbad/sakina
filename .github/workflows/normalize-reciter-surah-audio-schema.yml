name: One-time reciter-surah audio schema normalization

on:
  push:
    paths:
      - '.github/workflows/normalize-reciter-surah-audio-schema.yml'

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Normalize reciter-surah audio schema
        run: python scripts/normalize_reciter_surah_audio_schema.py
      - name: Commit page updates
        run: |
          if git diff --quiet; then
            echo "No page changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reciters/*/*/index.html
          git commit -m "Normalize reciter-surah audio structured data"
          git push

name: One-time OG URL repair

on:
  push:
    paths:
      - '.github/workflows/fix-missing-og-url.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Add missing og:url tags
        run: python scripts/fix_missing_og_url.py
      - name: Commit repairs
        run: |
          if git diff --quiet; then
            echo "No repairs needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add '*.html' ':!google*.html'
          git commit -m "Add missing Open Graph URLs"
          git push

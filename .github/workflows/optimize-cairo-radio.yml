name: One-time Cairo radio SEO cleanup

on:
  push:
    paths:
      - '.github/workflows/optimize-cairo-radio.yml'

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Optimize Cairo radio page
        run: python scripts/optimize_cairo_radio.py
      - name: Commit optimized page
        run: |
          if git diff --quiet; then
            echo "No page changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add radio/cairo/index.html
          git commit -m "Improve Cairo radio search intent coverage"
          git push

name: Generate PWA screenshots

on:
  push:
    paths:
      - '.github/workflows/pwa-screenshots.yml'

permissions:
  contents: write

jobs:
  screenshots:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Playwright
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          python -m playwright install --with-deps chromium

      - name: Capture actual Sakina UI
        run: |
          python -m http.server 8000 > /tmp/sakina-http.log 2>&1 &
          SERVER_PID=$!
          sleep 2
          python scripts/capture_pwa.py
          kill $SERVER_PID || true

      - name: Add screenshots to manifest and refresh PWA cache
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, re
          p = Path('manifest.webmanifest')
          m = json.loads(p.read_text(encoding='utf-8'))
          m['screenshots'] = [
              {'src':'/pwa-screenshot-mobile.png','sizes':'390x844','type':'image/png','form_factor':'narrow','label':'واجهة سكينة قرآن على الهاتف'},
              {'src':'/pwa-screenshot-wide.png','sizes':'1280x720','type':'image/png','form_factor':'wide','label':'واجهة سكينة قرآن على سطح المكتب'}
          ]
          p.write_text(json.dumps(m, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          sw = Path('sw.js')
          s = sw.read_text(encoding='utf-8')
          mt = re.search(r'const V = "sakina-v(\d+)";', s)
          if mt:
              s = s[:mt.start()] + f'const V = "sakina-v{int(mt.group(1))+1}";' + s[mt.end():]
          sw.write_text(s, encoding='utf-8')
          PY

      - name: Commit screenshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add manifest.webmanifest sw.js pwa-screenshot-mobile.png pwa-screenshot-wide.png
          git commit -m "Add PWA preview screenshots"
          git pull --rebase origin main
          git push origin main

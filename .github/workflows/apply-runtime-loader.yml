name: Apply independent runtime loader

on:
  push:
    paths:
      - 'app-loader.js'
      - 'scripts/runtime_loader_patch.py'
      - 'scripts/runtime_loader_qa.py'
      - '.github/workflows/apply-runtime-loader.yml'
  issues:
    types: [opened]

permissions:
  contents: write

jobs:
  migrate:
    if: github.event_name != 'issues' || github.event.issue.title == '[ops] apply runtime loader'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply runtime loader migration
        run: python scripts/runtime_loader_patch.py

      - name: Validate runtime separation
        run: python scripts/runtime_loader_qa.py

      - name: Validate JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            echo "Checking $file"
            node --check "$file"
          done < <(find . -type f -name '*.js' -not -path './.git/*' -print0)

      - name: Run existing static QA
        run: |
          python scripts/seo_qa.py
          python scripts/schema_qa.py
          python scripts/pwa_qa.py

      - name: Commit migration
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No changes needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Separate critical runtime from analytics and harden JS QA'
          git push

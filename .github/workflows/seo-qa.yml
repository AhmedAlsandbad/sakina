name: SEO QA

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  seo-qa:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run static SEO checks
        run: python scripts/seo_qa.py
      - name: Check duplicate structured data
        run: python scripts/schema_qa.py
      - name: Check PWA and notification configuration
        run: python scripts/pwa_qa.py
      - name: Check analytics/runtime separation
        run: python scripts/runtime_loader_qa.py
      - name: Check push deployment contract
        run: python scripts/push_qa.py
      - name: Validate every JavaScript file
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            echo "Checking $file"
            node --check "$file"
          done < <(find . -type f -name '*.js' -not -path './.git/*' -print0)

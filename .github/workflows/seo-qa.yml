name: SEO QA

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  seo-qa:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run static SEO checks
        run: python scripts/seo_qa.py
      - name: Check duplicate structured data
        run: python scripts/schema_qa.py
      - name: Check PWA and notification configuration
        run: python scripts/pwa_qa.py
      - name: Validate JavaScript syntax
        run: |
          node --check app.js
          node --check analytics.js
          node --check pwa.js
          node --check reminders.js
          node --check ux-enhancements.js
          node --check offline-audio.js
          node --check push-config.js
          node --check sw.js
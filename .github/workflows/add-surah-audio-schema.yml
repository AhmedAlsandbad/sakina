name: One-time surah audio schema update

on:
  push:
    paths:
      - '.github/workflows/add-surah-audio-schema.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Add AudioObject schema to existing surah pages
        run: python scripts/add_surah_audio_schema.py
      - name: Commit page updates
        run: |
          if git diff --quiet; then
            echo "No page changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add surahs/*/index.html
          git commit -m "Describe existing surah audio players in structured data"
          git push

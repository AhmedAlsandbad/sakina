<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>مواقيت الصلاة اليوم في دبي | سكينة قرآن</title><meta name="description" content="تعرف على مواقيت الصلاة اليوم في دبي للفجر والظهر والعصر والمغرب والعشاء، مع تحديث مباشر عند فتح الصفحة على سكينة قرآن."><meta name="robots" content="index,follow,max-snippet:-1"><link rel="canonical" href="https://sakinaquran.net/prayer-times/dubai/"><script type="application/ld+json">{"@context":"https://schema.org","@graph":[{"@type":"WebPage","name":"مواقيت الصلاة اليوم في دبي","url":"https://sakinaquran.net/prayer-times/dubai/","inLanguage":"ar","isPartOf":{"@type":"WebSite","name":"سكينة قرآن","url":"https://sakinaquran.net/"},"about":{"@type":"City","name":"دبي"}},{"@type":"BreadcrumbList","itemListElement":[{"@type":"ListItem","position":1,"name":"سكينة قرآن","item":"https://sakinaquran.net/"},{"@type":"ListItem","position":2,"name":"مواقيت الصلاة","item":"https://sakinaquran.net/prayer-times/"},{"@type":"ListItem","position":3,"name":"دبي","item":"https://sakinaquran.net/prayer-times/dubai/"}]}]}</script><style>body{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:#071512;color:#f7f1df;margin:0;line-height:1.9}main{max-width:760px;margin:auto;padding:42px 20px}a{color:#e7bd5a;text-decoration:none}.box{background:#0d2923;border:1px solid #285248;border-radius:18px;padding:22px;margin-top:18px}.times{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}.time{background:#102f28;border-radius:12px;padding:14px;text-align:center}.time b{display:block}.muted{color:#b9c8c1}</style></head><body><main><nav><a href="/">سكينة قرآن</a> · <a href="/prayer-times/">مواقيت الصلاة</a> · <a href="/quran/">القرآن</a></nav><h1>مواقيت الصلاة اليوم في دبي</h1><p>تعرض الصفحة مواقيت الصلاة الحالية في دبي عند فتحها، وتشمل الفجر والظهر والعصر والمغرب والعشاء.</p><section class="box"><h2>مواقيت اليوم</h2><div id="status" class="muted">جارٍ تحميل المواقيت…</div><div class="times" id="times"></div></section><section class="box"><h2>القرآن والأذكار</h2><p><a href="/quran/">القرآن الكريم</a> · <a href="/adhkar/">الأذكار اليومية</a> · <a href="/radio/sharjah/">إذاعة الشارقة للقرآن الكريم</a></p></section></main><script>const names={Fajr:'الفجر',Dhuhr:'الظهر',Asr:'العصر',Maghrib:'المغرب',Isha:'العشاء'};fetch('https://api.aladhan.com/v1/timingsByCity?city=Dubai&country=United%20Arab%20Emirates&method=16').then(r=>r.json()).then(j=>{const t=j.data.timings,s=document.getElementById('times');document.getElementById('status').textContent=j.data.date.hijri.day+' '+j.data.date.hijri.month.ar+' '+j.data.date.hijri.year+' هـ';s.innerHTML=Object.keys(names).map(k=>'<div class="time"><b>'+names[k]+'</b><span>'+t[k]+'</span></div>').join('')}).catch(()=>document.getElementById('status').textContent='تعذر تحميل المواقيت الآن. جرّب مرة أخرى لاحقًا.');</script></body></html>
